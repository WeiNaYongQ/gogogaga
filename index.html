<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070912">
  <title>Gogogaga — Local Platform Fighter</title>
  <style>
    :root {
      color-scheme: dark;
      background: #070912;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070912;
    }

    #game-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #070912;
    }

    #game {
      display: block;
      flex: none;
      width: 960px;
      height: 540px;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      outline: none;
      touch-action: none;
    }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Gogogaga local two-player platform fighter">
    <canvas id="game" width="960" height="540" tabindex="0" aria-label="Two-player platform fighter game"></canvas>
  </main>

  <script>
    'use strict';

    // ===== CONSTANTS =====
    // Physics values are expressed per fixed 60 Hz simulation tick.
    const GRAVITY = 0.72;
    const MAX_FALL = 17;
    const ACCEL = 1.0;
    const MAX_SPEED = 6;
    const GROUND_FRICTION = 0.80;
    const AIR_FRICTION = 0.95;
    const HIT_FRICTION = 0.985;
    const JUMP_V = -13.5;
    const DJUMP_V = -12.5;
    const KB_BASE = 4.5;
    const KB_SCALE = 0.15;
    const KB_MULT_X = 1.15;
    const KB_MULT_Y = 0.80;
    const HIT_DAMAGE = 9;
    const HITSTUN_BASE = 6;
    const HITSTUN_SCALE = 0.10;
    const STOCKS = 3;
    const ATTACK_DURATION = 14;
    const ATTACK_ACTIVE_START = 4;
    const ATTACK_ACTIVE_END = 10;
    const ATTACK_COOLDOWN = 26;
    const RESPAWN_INVULN = 100;
    const RESPAWN_DELAY = 55;

    const VIEW_WIDTH = 960;
    const VIEW_HEIGHT = 540;
    const FIXED_DT = 1 / 60;
    const MAX_FRAME_DELTA = 0.1;
    const MAX_ACCUMULATED_DELTA = FIXED_DT * 5;
    const FIGHTER_WIDTH = 38;
    const FIGHTER_HEIGHT = 56;
    const MAIN_STAGE = { x: 0, y: 470, w: 1600, h: 200, solid: true };
    const ONE_WAY_PLATFORMS = [
      { x: 200, y: 345, w: 220, h: 14, solid: false },
      { x: 1180, y: 345, w: 220, h: 14, solid: false },
      { x: 690, y: 230, w: 220, h: 14, solid: false }
    ];
    const STAGE_BOUNDS = { left: -200, right: 1800, top: -220, bottom: 740 };
    const BLAST_ZONES = { left: -200, right: 1800, top: -220, bottom: 740 };

    // ===== INPUT =====
    const keys = Object.create(null);
    const pressed = Object.create(null);

    function clearObject(object) {
      for (const key of Object.keys(object)) delete object[key];
    }

    function clearPressed() {
      clearObject(pressed);
    }

    function clearInput() {
      clearObject(keys);
      clearPressed();
    }

    window.addEventListener('keydown', (event) => {
      if (event.code.startsWith('Arrow')) event.preventDefault();
      if (!keys[event.code] && !event.repeat) pressed[event.code] = true;
      keys[event.code] = true;
    });

    window.addEventListener('keyup', (event) => {
      if (event.code.startsWith('Arrow')) event.preventDefault();
      keys[event.code] = false;
    });

    window.addEventListener('blur', clearInput);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) clearInput();
    });

    // ===== SHARED HELPERS =====
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function overlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x &&
        a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function roundRect(ctx, x, y, width, height, radius) {
      const r = Math.max(0, Math.min(radius, width / 2, height / 2));
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + width, y, x + width, y + height, r);
      ctx.arcTo(x + width, y + height, x, y + height, r);
      ctx.arcTo(x, y + height, x, y, r);
      ctx.arcTo(x, y, x + width, y, r);
      ctx.closePath();
    }

    // ===== PARTICLES =====
    const particles = [];

    // Randomness is deliberately limited to visual-only particle motion.
    function spark(x, y, color, count) {
      for (let i = 0; i < count; i += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 4.8;
        const life = 18 + Math.floor(Math.random() * 13);
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.2,
          life,
          maxLife: life,
          radius: 1.5 + Math.random() * 2.1,
          color
        });
      }
    }

    function updateParticles(dt) {
      const ticks = dt * 60;
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const particle = particles[i];
        particle.x += particle.vx * ticks;
        particle.y += particle.vy * ticks;
        particle.vx *= Math.pow(0.97, ticks);
        particle.vy += 0.25 * ticks;
        particle.life -= ticks;
        if (particle.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles(ctx) {
      for (const particle of particles) {
        const alpha = clamp(particle.life / particle.maxLife, 0, 1);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = particle.color;
        ctx.beginPath();
        ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ===== FIGHTER CLASS =====
    let fighters = [];
    let winner = null;

    class Fighter {
      constructor(config) {
        this.id = config.id;
        this.name = config.name;
        this.color = config.color;
        this.accent = config.accent;
        this.spawnX = config.spawnX;
        this.controls = config.controls;
        this.stocks = STOCKS;
        this.reset();
      }

      reset(options = {}) {
        const savedStocks = this.stocks;
        this.x = this.spawnX;
        this.y = 380;
        this.vx = 0;
        this.vy = 0;
        this.facing = this.id === 1 ? 1 : -1;
        this.damage = 0;
        this.onGround = false;
        this.jumpsLeft = 1;
        this.attackTimer = -1;
        this.attackCooldown = 0;
        this.hitstun = 0;
        this.invuln = 0;
        this.hitFlash = 0;
        this.hasHit = false;
        this.dead = false;
        this.respawnTimer = 0;
        this.stocks = options.preserveStocks ? savedStocks : STOCKS;
      }

      rect() {
        return { x: this.x, y: this.y, w: FIGHTER_WIDTH, h: FIGHTER_HEIGHT };
      }

      hitbox() {
        const width = 50;
        const height = 44;
        return {
          x: this.facing > 0 ? this.x + FIGHTER_WIDTH - 2 : this.x - width + 2,
          y: this.y + 6,
          w: width,
          h: height
        };
      }

      update(dt) {
        const ticks = dt * 60;

        if (this.dead) {
          this.respawnTimer = Math.max(0, this.respawnTimer - ticks);
          if (this.respawnTimer <= 0 && this.stocks > 0) {
            const savedStocks = this.stocks;
            this.reset({ preserveStocks: true });
            this.stocks = savedStocks;
            this.invuln = RESPAWN_INVULN;
          }
          return;
        }

        this.invuln = Math.max(0, this.invuln - ticks);
        this.hitFlash = Math.max(0, this.hitFlash - ticks);
        this.hitstun = Math.max(0, this.hitstun - ticks);
        this.attackCooldown = Math.max(0, this.attackCooldown - ticks);

        const previousX = this.x;
        const previousY = this.y;
        const previousBottom = previousY + FIGHTER_HEIGHT;
        const wasGrounded = this.onGround;
        const stunned = this.hitstun > 0;
        const horizontal = (keys[this.controls.left] ? -1 : 0) +
          (keys[this.controls.right] ? 1 : 0);

        this.onGround = false;

        if (stunned) {
          this.vx *= Math.pow(HIT_FRICTION, ticks);
        } else {
          if (horizontal !== 0) {
            this.vx = clamp(this.vx + horizontal * ACCEL * ticks, -MAX_SPEED, MAX_SPEED);
            this.facing = horizontal > 0 ? 1 : -1;
          } else {
            const friction = wasGrounded ? GROUND_FRICTION : AIR_FRICTION;
            this.vx *= Math.pow(friction, ticks);
            if (Math.abs(this.vx) < 0.035) this.vx = 0;
          }

          if (pressed[this.controls.jump]) {
            if (wasGrounded) {
              this.vy = JUMP_V;
              this.jumpsLeft = 1;
            } else if (this.jumpsLeft > 0) {
              this.vy = DJUMP_V;
              this.jumpsLeft -= 1;
            }
          }

          if (pressed[this.controls.attack] && this.attackCooldown <= 0) {
            this.attackTimer = 0;
            this.attackCooldown = ATTACK_COOLDOWN;
            this.hasHit = false;
          }
        }

        this.vy = Math.min(MAX_FALL, this.vy + GRAVITY * ticks);

        // Move horizontally first so the solid main stage blocks its sides.
        this.x += this.vx * ticks;
        const mainRight = MAIN_STAGE.x + MAIN_STAGE.w;
        const oldVerticalOverlap = previousY < MAIN_STAGE.y + MAIN_STAGE.h &&
          previousY + FIGHTER_HEIGHT > MAIN_STAGE.y;
        if (oldVerticalOverlap) {
          if (previousX + FIGHTER_WIDTH <= MAIN_STAGE.x && this.x + FIGHTER_WIDTH > MAIN_STAGE.x) {
            this.x = MAIN_STAGE.x - FIGHTER_WIDTH;
            this.vx = 0;
          } else if (previousX >= mainRight && this.x < mainRight) {
            this.x = mainRight;
            this.vx = 0;
          }
        }

        // Move vertically and resolve the fully solid main stage from all sides.
        this.y += this.vy * ticks;
        const mainRect = { x: MAIN_STAGE.x, y: MAIN_STAGE.y, w: MAIN_STAGE.w, h: MAIN_STAGE.h };
        if (overlap(this.rect(), mainRect)) {
          const currentBottom = this.y + FIGHTER_HEIGHT;
          const currentRight = this.x + FIGHTER_WIDTH;
          if (this.vy >= 0 && previousBottom <= MAIN_STAGE.y && currentBottom >= MAIN_STAGE.y) {
            this.y = MAIN_STAGE.y - FIGHTER_HEIGHT;
            this.vy = 0;
            this.onGround = true;
            this.jumpsLeft = 1;
          } else if (this.vy < 0 && previousY >= MAIN_STAGE.y + MAIN_STAGE.h && this.y <= MAIN_STAGE.y + MAIN_STAGE.h) {
            this.y = MAIN_STAGE.y + MAIN_STAGE.h;
            this.vy = 0;
          } else if (previousX + FIGHTER_WIDTH <= MAIN_STAGE.x && currentRight > MAIN_STAGE.x) {
            this.x = MAIN_STAGE.x - FIGHTER_WIDTH;
            this.vx = 0;
          } else if (previousX >= mainRight && this.x < mainRight) {
            this.x = mainRight;
            this.vx = 0;
          } else {
            // Swept movement normally handles every case; this resolves any residual overlap safely.
            const rect = this.rect();
            const penetrations = [
              { side: 'top', amount: rect.y + rect.h - MAIN_STAGE.y },
              { side: 'bottom', amount: MAIN_STAGE.y + MAIN_STAGE.h - rect.y },
              { side: 'left', amount: rect.x + rect.w - MAIN_STAGE.x },
              { side: 'right', amount: MAIN_STAGE.x + MAIN_STAGE.w - rect.x }
            ].filter((item) => item.amount >= 0).sort((a, b) => a.amount - b.amount);
            const side = penetrations[0]?.side;
            if (side === 'top') {
              this.y = MAIN_STAGE.y - FIGHTER_HEIGHT;
              this.vy = 0;
              this.onGround = true;
              this.jumpsLeft = 1;
            } else if (side === 'bottom') {
              this.y = MAIN_STAGE.y + MAIN_STAGE.h;
              this.vy = Math.max(0, this.vy);
            } else if (side === 'left') {
              this.x = MAIN_STAGE.x - FIGHTER_WIDTH;
              this.vx = 0;
            } else if (side === 'right') {
              this.x = mainRight;
              this.vx = 0;
            }
          }
        }

        // One-way platforms only catch downward movement from above. Down drops through them.
        if (!keys[this.controls.down]) {
          for (const platform of ONE_WAY_PLATFORMS) {
            const horizontalOverlap = this.x + FIGHTER_WIDTH > platform.x &&
              this.x < platform.x + platform.w;
            if (this.vy > 0 && previousBottom <= platform.y &&
                this.y + FIGHTER_HEIGHT >= platform.y && horizontalOverlap) {
              this.y = platform.y - FIGHTER_HEIGHT;
              this.vy = 0;
              this.onGround = true;
              this.jumpsLeft = 1;
              break;
            }
          }
        }
      }

      ko() {
        if (this.dead) return;
        this.dead = true;
        this.stocks = Math.max(0, this.stocks - 1);
        this.respawnTimer = RESPAWN_DELAY;
        this.attackTimer = -1;
        this.attackCooldown = 0;
        this.hitstun = 0;
        this.vx = 0;
        this.vy = 0;
        spark(this.x + FIGHTER_WIDTH / 2, this.y + FIGHTER_HEIGHT / 2, this.color, 24);

        if (this.stocks <= 0) {
          const other = fighters.find((fighter) => fighter !== this);
          if (other) winner = { name: other.name, color: other.color };
        }
      }
    }

    fighters = [
      new Fighter({
        id: 1,
        name: 'PLAYER 1',
        color: '#4fc3ff',
        accent: '#1565c0',
        spawnX: 500,
        controls: { left: 'KeyA', right: 'KeyD', jump: 'KeyW', down: 'KeyS', attack: 'KeyF' }
      }),
      new Fighter({
        id: 2,
        name: 'PLAYER 2',
        color: '#ff6b8a',
        accent: '#b3123c',
        spawnX: 1100,
        controls: { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', down: 'ArrowDown', attack: 'Slash' }
      })
    ];

    // ===== COMBAT =====
    let shakeFrames = 0;
    let shakeMagnitude = 0;

    function startScreenShake(frames, magnitude) {
      shakeFrames = Math.max(shakeFrames, frames);
      shakeMagnitude = Math.max(shakeMagnitude, magnitude);
    }

    function activeAttack(fighter) {
      return fighter.attackTimer >= ATTACK_ACTIVE_START &&
        fighter.attackTimer <= ATTACK_ACTIVE_END;
    }

    function resolveCombat() {
      // Snapshot active attacks so a pair of overlapping swings can trade on the same tick.
      const attacks = fighters.map((attacker) => ({
        attacker,
        target: fighters.find((fighter) => fighter !== attacker),
        box: attacker.hitbox()
      })).filter(({ attacker, target }) =>
        !attacker.dead && !target.dead && attacker.hitstun <= 0 &&
        !attacker.hasHit && activeAttack(attacker)
      );

      for (const { attacker, target, box } of attacks) {
        if (attacker.hasHit || target.invuln > 0 || !overlap(box, target.rect())) continue;

        attacker.hasHit = true;
        target.damage = Math.min(999, target.damage + HIT_DAMAGE);
        const power = KB_BASE + target.damage * KB_SCALE;
        const direction = Math.sign(target.x - attacker.x) || attacker.facing;
        target.vx = direction * power * KB_MULT_X;
        target.vy = -power * KB_MULT_Y - 2.5;
        target.hitstun = HITSTUN_BASE + target.damage * HITSTUN_SCALE;
        target.onGround = false;
        target.jumpsLeft = 1;
        target.hitFlash = 9;
        spark(box.x + box.w / 2, box.y + box.h / 2, '#ffffff', 10);
        startScreenShake(6, 4);
      }
    }

    function advanceAttackTimers(ticks) {
      for (const fighter of fighters) {
        if (fighter.attackTimer >= 0) {
          fighter.attackTimer += ticks;
          if (fighter.attackTimer >= ATTACK_DURATION) fighter.attackTimer = -1;
        }
      }
    }

    function checkBlastZones() {
      for (const fighter of fighters) {
        if (fighter.dead) continue;
        const centerX = fighter.x + FIGHTER_WIDTH / 2;
        const centerY = fighter.y + FIGHTER_HEIGHT / 2;
        if (centerX < BLAST_ZONES.left || centerX > BLAST_ZONES.right ||
            centerY < BLAST_ZONES.top || centerY > BLAST_ZONES.bottom) {
          fighter.ko();
        }
      }
    }

    // ===== CAMERA =====
    const camera = { x: 800, y: 450, zoom: 0.96 };

    function clampCamera() {
      const viewWidth = VIEW_WIDTH / camera.zoom;
      const viewHeight = VIEW_HEIGHT / camera.zoom;
      const stageWidth = STAGE_BOUNDS.right - STAGE_BOUNDS.left;
      const stageHeight = STAGE_BOUNDS.bottom - STAGE_BOUNDS.top;
      if (stageWidth <= viewWidth) {
        camera.x = (STAGE_BOUNDS.left + STAGE_BOUNDS.right) / 2;
      } else {
        camera.x = clamp(camera.x, STAGE_BOUNDS.left + viewWidth / 2, STAGE_BOUNDS.right - viewWidth / 2);
      }
      if (stageHeight <= viewHeight) {
        camera.y = (STAGE_BOUNDS.top + STAGE_BOUNDS.bottom) / 2;
      } else {
        camera.y = clamp(camera.y, STAGE_BOUNDS.top + viewHeight / 2, STAGE_BOUNDS.bottom - viewHeight / 2);
      }
    }

    function updateCamera(dt) {
      const living = fighters.filter((fighter) => !fighter.dead && fighter.stocks > 0);
      if (living.length === 0) return;

      let targetX = 0;
      let targetY = 0;
      for (const fighter of living) {
        targetX += fighter.x + FIGHTER_WIDTH / 2;
        targetY += fighter.y + FIGHTER_HEIGHT / 2;
      }
      targetX /= living.length;
      targetY /= living.length;

      let targetZoom = 1.6;
      if (living.length > 1) {
        const first = living[0];
        const second = living[1];
        const distance = Math.max(
          Math.abs((first.x + FIGHTER_WIDTH / 2) - (second.x + FIGHTER_WIDTH / 2)),
          Math.abs((first.y + FIGHTER_HEIGHT / 2) - (second.y + FIGHTER_HEIGHT / 2))
        );
        targetZoom = clamp(VIEW_WIDTH / (distance + 400), 0.6, 1.6);
      }

      const smoothing = 1 - Math.pow(1 - 0.08, dt * 60);
      camera.x += (targetX - camera.x) * smoothing;
      camera.y += (targetY - camera.y) * smoothing;
      camera.zoom += (targetZoom - camera.zoom) * smoothing;
      clampCamera();
    }

    function resetCamera() {
      camera.x = 800;
      camera.y = 450;
      camera.zoom = 0.96;
      clampCamera();
    }

    // ===== RENDER =====
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let simulationFrame = 0;

    function resizeCanvas() {
      const scale = Math.min(window.innerWidth / VIEW_WIDTH, window.innerHeight / VIEW_HEIGHT);
      canvas.style.width = `${VIEW_WIDTH * scale}px`;
      canvas.style.height = `${VIEW_HEIGHT * scale}px`;
    }

    window.addEventListener('resize', resizeCanvas);

    function drawBackground(context) {
      const gradient = context.createLinearGradient(0, 0, 0, VIEW_HEIGHT);
      gradient.addColorStop(0, '#151b36');
      gradient.addColorStop(1, '#070912');
      context.fillStyle = gradient;
      context.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
    }

    function drawPlatforms(context) {
      const glowGradient = context.createLinearGradient(0, 340, 0, 520);
      glowGradient.addColorStop(0, 'rgba(82, 112, 227, 0.02)');
      glowGradient.addColorStop(1, 'rgba(82, 112, 227, 0.13)');
      context.fillStyle = glowGradient;
      context.fillRect(-100, 300, 1800, 240);

      for (const platform of ONE_WAY_PLATFORMS) {
        context.fillStyle = 'rgba(120, 150, 255, 0.12)';
        roundRect(context, platform.x - 3, platform.y + 4, platform.w + 6, platform.h + 14, 8);
        context.fill();
      }

      context.fillStyle = '#232c4d';
      roundRect(context, MAIN_STAGE.x, MAIN_STAGE.y, MAIN_STAGE.w, MAIN_STAGE.h, 10);
      context.fill();
      context.fillStyle = '#3d4a80';
      roundRect(context, MAIN_STAGE.x, MAIN_STAGE.y, MAIN_STAGE.w, 3, 1.5);
      context.fill();

      for (const platform of ONE_WAY_PLATFORMS) {
        context.fillStyle = '#232c4d';
        roundRect(context, platform.x, platform.y, platform.w, platform.h, 7);
        context.fill();
        context.fillStyle = '#3d4a80';
        roundRect(context, platform.x, platform.y, platform.w, 3, 1.5);
        context.fill();
      }
    }

    function damageColor(damage) {
      if (damage < 50) return '#e8ecff';
      if (damage < 100) return '#ffd866';
      if (damage < 150) return '#ff9f43';
      return '#ff4d4d';
    }

    function drawAttackSwipe(context, fighter) {
      if (fighter.attackTimer < 0) return;
      const box = fighter.hitbox();
      const active = activeAttack(fighter);
      context.save();
      context.globalAlpha = active ? 0.48 : 0.13;
      context.fillStyle = active ? '#ffffff' : fighter.color;
      roundRect(context, box.x, box.y, box.w, box.h, 8);
      context.fill();
      if (active) {
        context.globalAlpha = 0.75;
        context.strokeStyle = '#ffffff';
        context.lineWidth = 2;
        context.stroke();
      }
      context.restore();
    }

    function drawFighter(context, fighter) {
      if (fighter.dead) return;
      if (fighter.invuln > 0) {
        const elapsed = RESPAWN_INVULN - fighter.invuln;
        if (Math.floor(elapsed / 4) % 2 === 0) return;
      }

      drawAttackSwipe(context, fighter);

      const running = fighter.onGround && Math.abs(fighter.vx) > 0.45;
      const phase = simulationFrame * 0.23 + fighter.id * 1.7;
      const stride = running ? Math.sin(phase) * 8 : 0;
      const jumping = !fighter.onGround && fighter.vy < -1;
      const falling = !fighter.onGround && fighter.vy > 2;
      const hit = fighter.hitstun > 0;
      const attacking = fighter.attackTimer >= 0;
      const tilt = hit ? Math.sin(simulationFrame * 0.6 + fighter.id) * 0.28 :
        (falling ? fighter.facing * 0.08 : 0);
      const stroke = fighter.hitFlash > 0 ? '#ffffff' : fighter.color;

      context.save();
      context.translate(fighter.x + FIGHTER_WIDTH / 2, fighter.y + FIGHTER_HEIGHT / 2);
      context.rotate(tilt);
      context.strokeStyle = stroke;
      context.fillStyle = stroke;
      context.lineWidth = 4;
      context.lineCap = 'round';
      context.lineJoin = 'round';

      // Head and body.
      context.beginPath();
      context.arc(0, -18, 10, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = fighter.hitFlash > 0 ? '#ffffff' : fighter.accent;
      context.beginPath();
      context.arc(fighter.facing * 4, -19, 1.6, 0, Math.PI * 2);
      context.fill();
      context.fillStyle = stroke;
      context.beginPath();
      context.moveTo(0, -8);
      context.lineTo(0, 13);
      context.stroke();

      // Arms react to locomotion, jumping, attacks, and hitstun.
      context.beginPath();
      context.moveTo(0, -4);
      if (hit) {
        const flail = Math.sin(simulationFrame * 0.75 + fighter.id) * 9;
        context.lineTo(-fighter.facing * 13, -17 + flail);
        context.moveTo(0, -4);
        context.lineTo(fighter.facing * 15, 8 - flail);
      } else if (attacking) {
        context.lineTo(fighter.facing * 29, -8);
        context.moveTo(0, -4);
        context.lineTo(-fighter.facing * 13, 5 + (running ? -stride * 0.25 : 0));
      } else if (jumping) {
        context.lineTo(-fighter.facing * 12, -22);
        context.moveTo(0, -4);
        context.lineTo(fighter.facing * 11, -19);
      } else {
        context.lineTo(-fighter.facing * (12 + stride * 0.35), 5);
        context.moveTo(0, -4);
        context.lineTo(fighter.facing * (12 - stride * 0.35), 5);
      }
      context.stroke();

      // Legs swing while running and tuck in the air.
      context.beginPath();
      context.moveTo(0, 13);
      if (jumping) {
        context.lineTo(-11, 20);
        context.moveTo(0, 13);
        context.lineTo(11, 19);
      } else if (hit) {
        context.lineTo(-12, 27);
        context.moveTo(0, 13);
        context.lineTo(12, 24);
      } else {
        context.lineTo(-8 + stride, 28);
        context.moveTo(0, 13);
        context.lineTo(8 - stride, 28);
      }
      context.stroke();
      context.restore();

      const text = `${Math.floor(fighter.damage)}%`;
      const textX = fighter.x + FIGHTER_WIDTH / 2;
      const textY = fighter.y - 11;
      context.save();
      context.font = 'bold 22px system-ui, sans-serif';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.lineWidth = 4;
      context.strokeStyle = 'rgba(4, 6, 14, 0.95)';
      context.strokeText(text, textX, textY);
      context.fillStyle = damageColor(fighter.damage);
      context.fillText(text, textX, textY);
      context.restore();
    }

    function drawHud(context) {
      context.save();
      context.font = 'bold 20px system-ui, sans-serif';
      context.textBaseline = 'alphabetic';

      const left = fighters[0];
      const right = fighters[1];
      context.textAlign = 'left';
      context.fillStyle = left.color;
      context.fillText(left.name, 30, 39);
      for (let i = 0; i < left.stocks; i += 1) {
        context.beginPath();
        context.arc(39 + i * 24, 62, 8, 0, Math.PI * 2);
        context.fill();
      }

      context.textAlign = 'right';
      context.fillStyle = right.color;
      context.fillText(right.name, VIEW_WIDTH - 30, 39);
      for (let i = 0; i < right.stocks; i += 1) {
        context.beginPath();
        context.arc(VIEW_WIDTH - 39 - i * 24, 62, 8, 0, Math.PI * 2);
        context.fill();
      }

      context.font = '12px system-ui, sans-serif';
      context.textBaseline = 'bottom';
      context.textAlign = 'left';
      context.fillStyle = 'rgba(207, 216, 255, 0.72)';
      context.fillText('P1  A / D move  ·  W jump  ·  S drop  ·  F attack', 24, VIEW_HEIGHT - 12);
      context.textAlign = 'right';
      context.fillText('P2  ← / → move  ·  ↑ jump  ·  ↓ drop  ·  / attack', VIEW_WIDTH - 24, VIEW_HEIGHT - 12);

      if (winner) {
        context.fillStyle = 'rgba(4, 6, 14, 0.72)';
        context.fillRect(0, 0, VIEW_WIDTH, VIEW_HEIGHT);
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.font = 'bold 58px system-ui, sans-serif';
        context.lineWidth = 7;
        context.strokeStyle = 'rgba(4, 6, 14, 0.95)';
        const title = `${winner.name} WINS!`;
        context.strokeText(title, VIEW_WIDTH / 2, VIEW_HEIGHT / 2 - 12);
        context.fillStyle = winner.color;
        context.fillText(title, VIEW_WIDTH / 2, VIEW_HEIGHT / 2 - 12);
        context.font = '20px system-ui, sans-serif';
        context.fillStyle = '#cfd8ff';
        context.fillText('press R to rematch', VIEW_WIDTH / 2, VIEW_HEIGHT / 2 + 43);
      }
      context.restore();
    }

    function render() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      drawBackground(ctx);

      const shakeFade = shakeFrames > 0 ? shakeFrames / 6 : 0;
      const shakeX = shakeFrames > 0 ? Math.sin(simulationFrame * 2.17) * shakeMagnitude * shakeFade : 0;
      const shakeY = shakeFrames > 0 ? Math.cos(simulationFrame * 1.73) * shakeMagnitude * shakeFade : 0;

      ctx.save();
      ctx.translate(VIEW_WIDTH / 2 + shakeX, VIEW_HEIGHT / 2 + shakeY);
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-camera.x, -camera.y);

      const stageGlow = ctx.createRadialGradient(800, 405, 30, 800, 405, 920);
      stageGlow.addColorStop(0, 'rgba(80, 105, 202, 0.18)');
      stageGlow.addColorStop(1, 'rgba(21, 27, 54, 0)');
      ctx.fillStyle = stageGlow;
      ctx.fillRect(-200, -220, 2000, 960);

      drawPlatforms(ctx);
      drawParticles(ctx);
      for (const fighter of fighters) drawFighter(ctx, fighter);
      ctx.restore();

      drawHud(ctx);
    }

    function resetMatch() {
      winner = null;
      for (const fighter of fighters) fighter.reset();
      particles.length = 0;
      shakeFrames = 0;
      shakeMagnitude = 0;
      simulationFrame = 0;
      resetCamera();
      clearInput();
    }

    // ===== GAME LOOP =====
    function stepSimulation(dt) {
      const ticks = dt * 60;
      simulationFrame += 1;
      if (shakeFrames > 0) {
        shakeFrames = Math.max(0, shakeFrames - ticks);
        if (shakeFrames === 0) shakeMagnitude = 0;
      }

      if (winner) {
        if (pressed.KeyR) {
          resetMatch();
          return;
        }
        updateParticles(dt);
        return;
      }

      for (const fighter of fighters) fighter.update(dt);
      resolveCombat();
      checkBlastZones();
      advanceAttackTimers(ticks);
      updateParticles(dt);
      updateCamera(dt);
    }

    let accumulator = 0;
    let previousTime = null;

    function gameLoop(timestamp) {
      if (previousTime === null) previousTime = timestamp;
      const elapsed = Math.max(0, Math.min((timestamp - previousTime) / 1000, MAX_FRAME_DELTA));
      previousTime = timestamp;
      accumulator = Math.min(accumulator + elapsed, MAX_ACCUMULATED_DELTA);

      while (accumulator + 1e-10 >= FIXED_DT) {
        stepSimulation(FIXED_DT);
        clearPressed();
        accumulator -= FIXED_DT;
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    resizeCanvas();
    resetCamera();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
